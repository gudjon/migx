# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Migx CI

# The fast gate for everyday work: the checks that actually catch things in
# this fork, in about a minute. Heavy C++ builds belong on tags and PRs, not
# on every commit — see release.yml for why.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A burst of commits should verify the tip, not queue a job per commit.
  group: migx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: lint + cli tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The kanban lints parse registry/peers YAML with PyYAML. It is their only
      # dependency, and without it they now fail loudly rather than reading an
      # empty registry as "nothing registered" (see _kanban_lint.parse_yaml_lite).
      # migx-cli itself stays stdlib-only — this is for the harness lints.
      - name: Install lint dependencies
        run: pip install pyyaml

      - name: migx-cli tests (offline, stdlib only)
        run: python3 tools/migx-cli/test_migx_cli.py

      - name: EXO tool tests
        run: |
          python3 tools/exo/test_copilot_tempo.py
          python3 tools/exo/test_ontology_from_sidecar.py
          python3 tools/exo/test_set_planner.py

      - name: Harness discipline (dossiers, patterns, DDD, keymap)
        run: |
          python3 kanban/scripts/lint-dossier-frontmatter.py
          python3 kanban/scripts/verify-prefix-registry.py
          python3 kanban/scripts/lint-naming-conventions.py
          python3 kanban/scripts/verify-ps-citations.py
          python3 kanban/scripts/verify-sealed-dossier-has-closure.py
          python3 kanban/architecture/lint/verify-owns-paths-exist.py
          python3 kanban/architecture/lint/verify-agents-md-present.py
          python3 .claude/architecture/lint/verify-skill-grounding.py
          python3 kanban/scripts/gen-pattern-index.py --check
          python3 kanban/architecture/ddd/gen-index.py --check

      - name: Command vocabulary (ADR-008)
        run: python3 kanban/architecture/lint/verify-command-vocabulary.py

      # Deliberately NOT `pre-commit/action` (which runs every hook over every
      # file). Three ways that fails here, none of them a real defect:
      #   - `no-commit-to-branch -b main` fails BY DESIGN on a push to main
      #   - `qmllint`/`qmlformat` are `language: system` — no Qt on this runner
      #   - `black`/`flake8`/`gersemi`/whitespace hooks flag inherited upstream
      #     Mixxx files we have not reformatted (a fork-wide reformat would
      #     destroy `git blame` against upstream)
      # So CI runs the subset that is green repo-wide and needs no toolchain.
      # The full hook set remains the LOCAL gate on changed files only —
      # `pre-commit run --files <changed>` — per CLAUDE.md.
      - name: Repo hygiene (toolchain-free pre-commit hooks)
        # `pre-commit run` takes ONE hook id, so loop rather than listing them.
        run: |
          pip install pre-commit
          rc=0
          for hook in check-json check-yaml check-xml \
                      check-merge-conflict check-case-conflict \
                      fix-byte-order-marker mixed-line-ending \
                      check-github-workflows cmakelint; do
            pre-commit run "$hook" --all-files || rc=1
          done
          exit $rc
